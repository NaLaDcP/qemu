<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>MPC8xxx GPIO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    header h1 { font-size: 1.1rem; letter-spacing: 0.05em; color: #e94560; }

    #status {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: #333;
      color: #aaa;
    }
    #status.connected { background: #1a4731; color: #4caf50; }
    #status.error     { background: #4a1010; color: #f44336; }

    main { display: flex; flex: 1; overflow: hidden; }

    /* ── Panneau GPIO ── */
    #pins-panel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #0f3460;
      overflow: hidden;
    }

    .panel-title {
      padding: 8px 16px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #888;
      text-transform: uppercase;
      border-bottom: 1px solid #0f3460;
      background: #16213e;
    }

    #pins-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }

    /* ── Base pin button ── */
    .pin-btn {
      padding: 4px 2px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #22223b;
      color: #aaa;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.65rem;
      text-align: center;
      user-select: none;
      line-height: 1.2;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    /* Direction inconnue — cliquable, hover visible */
    .pin-btn:not(.in):not(.out):hover { border-color: #555; background: #2d2d4e; }

    /* ── Input (piloté par l'utilisateur) ── */
    .pin-btn.in          { cursor: pointer; }
    .pin-btn.in.off      { background: #22223b; border-color: #444; color: #999; }
    .pin-btn.in.on       { background: #3a2e00; border-color: #fdd835; color: #fdd835; }
    .pin-btn.in:hover    { filter: brightness(1.15); }

    /* ── Output (piloté par le firmware, lecture seule) ── */
    .pin-btn.out         { cursor: not-allowed; pointer-events: none; }
    .pin-btn.out.off     { background: #2e2e2e; border-color: #505050; color: #777; opacity: 0.45; }
    .pin-btn.out.on      { background: #3d1f00; border-color: #e65c00; color: #ff8c00; }

    /* ── Sous-éléments ── */
    .pin-num   { font-size: 0.58rem; color: #555; margin-bottom: 1px; }
    .pin-state { font-size: 0.7rem; font-weight: bold; }

    /* ── Panneau Log ── */
    #log-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .log-entry { border-bottom: 1px solid #1e1e3a; padding: 2px 0; }
    .log-entry .ts      { color: #555; }
    .log-entry .dir-in  { color: #ff9800; }
    .log-entry .dir-out { color: #29b6f6; }
    .log-entry .reg     { color: #ce93d8; }
    .log-entry .err     { color: #f44336; }
    .log-entry .info    { color: #78909c; }

    #log-controls {
      padding: 6px 14px;
      border-top: 1px solid #0f3460;
      background: #16213e;
      display: flex;
      gap: 8px;
    }

    #log-controls button {
      padding: 3px 10px;
      font-family: monospace;
      font-size: 0.72rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #22223b;
      color: #aaa;
      cursor: pointer;
    }
    #log-controls button:hover { background: #2d2d4e; }
  </style>
</head>
<body>

<header>
  <h1>MPC8xxx GPIO Controller</h1>
  <span id="status">déconnecté</span>
</header>

<main>
  <section id="pins-panel">
    <div class="panel-title">GPIO Pins</div>
    <div id="pins-grid"></div>
  </section>

  <section id="log-panel">
    <div class="panel-title">Log</div>
    <div id="log"></div>
    <div id="log-controls">
      <button id="btn-clear">Effacer</button>
      <button id="btn-scroll">Auto-scroll : ON</button>
    </div>
  </section>
</main>

<script>
  const N_PINS = 32;
  const WS_URL = `ws://${location.host}/ws`;

  const pinStates = new Array(N_PINS).fill(0);
  const pinNames  = {};
  let dirReg = null;   // null = inconnu
  let odrReg = 0;
  let ws = null;
  let autoScroll = true;

  // ── Grille ────────────────────────────────────────────────────────────────
  const grid = document.getElementById("pins-grid");
  for (let i = 0; i < N_PINS; i++) {
    const btn = document.createElement("button");
    btn.id = `pin-${i}`;
    btn.className = "pin-btn";
    btn.innerHTML =
      `<div class="pin-num">P${String(i).padStart(2,"0")}</div>
       <div class="pin-state" id="state-${i}">-</div>`;
    btn.addEventListener("click", () => onPinClick(i));
    grid.appendChild(btn);
  }

  // ── Logique direction ─────────────────────────────────────────────────────
  function isOutput(i) {
    if (dirReg === null) return null;
    return !!(dirReg & (0x80000000 >>> i));
  }

  function isOD(i) {
    return !!(odrReg & (0x80000000 >>> i));
  }

  function pinLabel(i) {
    return pinNames[i] ?? pinNames[String(i)] ?? `P${String(i).padStart(2,"0")}`;
  }

  function refreshButton(i) {
    const btn   = document.getElementById(`pin-${i}`);
    const state = pinStates[i];
    const out   = isOutput(i);

    let cls = "pin-btn";
    if (out === true)       cls += " out " + (state ? "on" : "off");
    else if (out === false) cls += " in "  + (state ? "on" : "off");
    btn.className = cls;

    btn.title = `P${String(i).padStart(2,"0")}${pinNames[i] ? " – " + pinNames[i] : ""}`;
    btn.querySelector(".pin-num").textContent   = pinLabel(i);
    document.getElementById(`state-${i}`).textContent = out === null ? "?" : (state ? "1" : "0");
  }

  function applyRegUpdate(offset, value) {
    if (offset === 0x0) { dirReg = value; for (let i = 0; i < N_PINS; i++) refreshButton(i); }
    if (offset === 0x4) { odrReg = value; for (let i = 0; i < N_PINS; i++) refreshButton(i); }
  }

  function onPinClick(i) {
    if (isOutput(i) === true) return;   // outputs ignorés (disabled mais sécurité)
    const newState = pinStates[i] ? 0 : 1;
    pinStates[i] = newState;
    refreshButton(i);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ pin: i, state: newState }));
      addLog("out", `pin=${String(i).padStart(2,"0")} → ${newState ? "ON" : "OFF"}`);
    } else {
      addLog("err", "WebSocket non connecté");
    }
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  const logEl = document.getElementById("log");

  function ts() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}.${String(d.getMilliseconds()).padStart(3,"0")}`;
  }

  function addLog(type, text) {
    const e = document.createElement("div");
    e.className = "log-entry";
    const t = `<span class="ts">${ts()}</span>`;
    if      (type === "out") e.innerHTML = `${t}  <span class="dir-out">→ QEMU</span>  ${text}`;
    else if (type === "in")  e.innerHTML = `${t}  <span class="dir-in">← QEMU</span>  ${text}`;
    else if (type === "reg") e.innerHTML = `${t}  <span class="reg">  REG </span>  ${text}`;
    else if (type === "err") e.innerHTML = `${t}  <span class="err">erreur</span>  ${text}`;
    else                     e.innerHTML = `${t}  <span class="info">${text}</span>`;
    logEl.appendChild(e);
    if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById("btn-clear").addEventListener("click", () => logEl.innerHTML = "");
  const btnScroll = document.getElementById("btn-scroll");
  btnScroll.addEventListener("click", () => {
    autoScroll = !autoScroll;
    btnScroll.textContent = `Auto-scroll : ${autoScroll ? "ON" : "OFF"}`;
  });

  // ── WebSocket ─────────────────────────────────────────────────────────────
  const statusEl = document.getElementById("status");

  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      statusEl.textContent = "connecté";
      statusEl.className = "connected";
      addLog("info", "WebSocket connecté");
    };

    ws.onclose = () => {
      statusEl.textContent = "déconnecté";
      statusEl.className = "error";
      addLog("err", "WebSocket fermé — reconnexion dans 3s");
      setTimeout(connect, 3000);
    };

    ws.onerror = () => addLog("err", "Erreur WebSocket");

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === "pin_names") {
          Object.assign(pinNames, msg.names);
          for (let i = 0; i < N_PINS; i++) refreshButton(i);
        } else if (msg.type === "pin_update") {
          pinStates[msg.pin] = msg.state;
          refreshButton(msg.pin);
          addLog("in", `pin=${String(msg.pin).padStart(2,"0")} state=${msg.state ? "ON" : "OFF"}`);
        } else if (msg.type === "reg_update") {
          applyRegUpdate(msg.offset, msg.value);
          addLog("reg", `${msg.name.toUpperCase()} = 0x${msg.value.toString(16).padStart(8,"0")}`);
        } else if (msg.type === "qemu_status") {
          if (msg.connected) {
            statusEl.textContent = "connecté (QEMU OK)";
            statusEl.className = "connected";
            addLog("info", "QEMU connecté");
          } else {
            statusEl.textContent = "QEMU déconnecté";
            statusEl.className = "error";
            addLog("err", "QEMU non disponible — nouvel essai dans 3s");
          }
        } else if (msg.type === "error") {
          addLog("err", msg.msg);
        }
      } catch (e) {
        addLog("err", `Parse error : ${e}`);
      }
    };
  }

  connect();
</script>
</body>
</html>
